name: Test source

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      bundle-key:
        description: "Key needed to access bundle of artifacts"
        required: true
        type: string
      build-target:
        description: "Target name as defined by inputs.sh"
        required: true
        type: string
      container-path:
        description: "Path to built container at registry"
        required: true
        type: string
      runs-on:
        description: "Runner label to use (e.g., ubuntu-24.04 or ubuntu-24.04-arm)"
        required: false
        default: ubuntu-24.04
        type: string

env:
  INTEGRATION_TESTS_ARGS: "--extended --exclude feature_pruning,feature_dbcrash"
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1  # GHA does not care about dangling processes and setting this variable avoids killing the CI script itself on error

jobs:
  test-src:
    name: Test source
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ inputs.container-path }}
      options: --user root
    steps:
      # Copy trusted policy outside the workspace BEFORE checking out PR code.
      # The PR checkout can replace every tracked file, including CI helpers.
      - name: Checkout trusted extraction policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Preserve trusted policy and prepare private staging
        id: policy
        run: |
          set -euo pipefail
          command -v runuser
          command -v zstd
          policy=$(mktemp -d "${RUNNER_TEMP}/bundle-policy.XXXXXXXX")
          stage=$(mktemp -d "${RUNNER_TEMP}/bundle-stage.XXXXXXXX")
          cp ci/smartiecoin/bundle_archive.py ci/smartiecoin/test_bundle_archive.py "$policy/"
          chmod 755 "$policy"
          chmod 644 "$policy/"*.py
          chown nobody:nogroup "$stage"
          echo "directory=$policy" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.bundle-key }}
          path: ${{ runner.temp }}/bundle-input

      - name: Validate and install build bundle with trusted policy
        env:
          BUILD_TARGET: ${{ inputs.build-target }}
          BUNDLE_KEY: ${{ inputs.bundle-key }}
          POLICY_DIR: ${{ steps.policy.outputs.directory }}
          STAGING_DIR: ${{ steps.policy.outputs.stage }}
        run: |
          set -euo pipefail
          # No workspace scripts, imports, archive binaries or PR hooks run here.
          runuser -u nobody -- env -i PATH=/usr/local/bin:/usr/bin:/bin \
            HOME="$STAGING_DIR" TMPDIR="$STAGING_DIR" \
            python3 -I "$POLICY_DIR/test_bundle_archive.py" -v
          runuser -u nobody -- env -i PATH=/usr/local/bin:/usr/bin:/bin \
            HOME="$STAGING_DIR" TMPDIR="$STAGING_DIR" \
            BUILD_TARGET="$BUILD_TARGET" BUNDLE_KEY="$BUNDLE_KEY" \
            python3 -I "$POLICY_DIR/bundle_archive.py" extract \
            --archive-dir "${RUNNER_TEMP}/bundle-input" --workspace "$STAGING_DIR"
          # Installation is a move of one fully validated, link-free subtree.
          # Refuse even a pre-existing/dangling build-ci symlink from PR checkout.
          test ! -e build-ci && test ! -L build-ci
          mkdir -m 755 build-ci
          mv -- "$STAGING_DIR/build-ci/smartiecoin-$BUILD_TARGET" build-ci/
        shell: bash

      - name: Manage releases cache
        uses: actions/cache/restore@v4
        if: inputs.build-target == 'linux64'
        with:
          path: |
            releases
          key: releases-${{ hashFiles('ci/test/00_setup_env_native_qt5.sh', 'test/get_previous_releases.py') }}

      - name: Run functional tests
        id: test
        env:
          BUILD_TARGET: ${{ inputs.build-target }}
          BUNDLE_KEY: ${{ inputs.bundle-key }}
        run: |
          git config --global --add safe.directory "$PWD"
          ./ci/smartiecoin/slim-workspace.sh
          source ./ci/smartiecoin/matrix.sh
          ./ci/smartiecoin/test_integrationtests.sh ${INTEGRATION_TESTS_ARGS}
        shell: bash

      - name: Bundle test logs
        id: bundle
        if: success() || (failure() && steps.test.outcome == 'failure')
        env:
          BUILD_TARGET: ${{ inputs.build-target }}
        run: |
          echo "short-sha=$(git rev-parse --short=8 HEAD)" >> "${GITHUB_OUTPUT}"
          ( [ -d "testlogs" ] && echo "upload-logs=true" >> "${GITHUB_OUTPUT}" && ./ci/smartiecoin/bundle-logs.sh ) \
                              || echo "upload-logs=false" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: |
          success() || (failure() && steps.test.outcome == 'failure')
          && steps.bundle.outputs.upload-logs == 'true'
        with:
          name: test_logs-${{ inputs.build-target }}-${{ steps.bundle.outputs.short-sha }}
          path: |
            test_logs-${{ inputs.build-target }}.tar.zst
            test_logs-${{ inputs.build-target }}.tar.zst.sha256
          compression-level: 0
          overwrite: true
          retention-days: 1
