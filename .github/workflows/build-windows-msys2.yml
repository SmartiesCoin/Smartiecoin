name: Build Windows (MSYS2 / BDB 4.8 + Qt5)

# Windows-native build using MSYS2 + MinGW-w64 on GitHub's windows-latest
# runner. Produces fully-static smartiecoind.exe / smartiecoin-cli.exe /
# smartiecoin-wallet.exe / smartiecoin-qt.exe. Legacy wallet support uses
# pinned Berkeley DB 4.8.30 sources, never the system BDB package.
#
# Triggers automatically on every v* tag — no manual rebuild needed at
# release time. Runs alongside the standard Guix matrix so Linux/macOS
# and Windows stay on the canonical BDB 4.8 path.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows-msys2:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            curl
            git
            autoconf
            automake
            libtool
            make
            pkg-config
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-libnatpmp
            mingw-w64-x86_64-qt5-static
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-bzip2

      - name: Test release BDB policy
        run: python3 test/lint/test_release_bdb_policy.py -v

      - name: Show toolchain
        run: |
          gcc --version | head -1
          rustc --version
          cargo --version
          ls /mingw64/qt5-static/bin/qmake.exe && /mingw64/qt5-static/bin/qmake.exe -v || true

      - name: Verify static Qt dependencies
        run: |
          set -euo pipefail
          for library in \
            /mingw64/lib/libfreetype.a \
            /mingw64/lib/libharfbuzz.a \
            /mingw64/lib/libzstd.a \
            /mingw64/lib/libpng16.a \
            /mingw64/lib/libpcre2-16.a \
            /mingw64/lib/libz.a \
            /mingw64/lib/libbrotlidec.a \
            /mingw64/lib/libbrotlicommon.a \
            /mingw64/lib/libbz2.a \
            /mingw64/qt5-static/lib/libQt5VulkanSupport.a; do
            test -s "$library" || { echo "Missing required static Qt dependency: $library" >&2; exit 1; }
          done

      - name: Build pinned Berkeley DB 4.8.30
        run: |
          set -euo pipefail
          BDB_PREFIX="$PWD/bdb48"
          curl --fail --location --retry 3 --output db-4.8.30.NC.tar.gz \
            https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz
          printf '%s  %s\n' 12edc0df75bf9abd7f82f821795bcee50f42cb2e5f76a6a281b85732798364ef db-4.8.30.NC.tar.gz | sha256sum --check --strict
          tar -xzf db-4.8.30.NC.tar.gz
          patch -d db-4.8.30.NC -p1 < depends/patches/bdb/clang_cxx_11.patch
          chmod u+w db-4.8.30.NC/dist/config.guess db-4.8.30.NC/dist/config.sub
          cp depends/config.guess depends/config.sub db-4.8.30.NC/dist/
          cd db-4.8.30.NC/build_unix
          ../dist/configure \
            --host=x86_64-w64-mingw32 \
            --prefix="$BDB_PREFIX" \
            --enable-mingw --enable-cxx --enable-static \
            --disable-shared --disable-replication \
            CC=/mingw64/bin/gcc CXX=/mingw64/bin/g++ \
            CPPFLAGS="-DUNICODE -D_UNICODE" \
            CFLAGS="-O2 -Wno-error=implicit-function-declaration -Wno-error=format-security -Wno-error=implicit-int" \
            CXXFLAGS="-O2"
          make -j2 libdb_cxx-4.8.a libdb-4.8.a
          make install_lib install_include
          test -s "$BDB_PREFIX/include/db.h"
          test -s "$BDB_PREFIX/include/db_cxx.h"
          test -s "$BDB_PREFIX/lib/libdb_cxx-4.8.a"
          test -s "$BDB_PREFIX/lib/libdb-4.8.a"

      - name: autogen
        run: ./autogen.sh

      - name: Debug Qt5-static layout
        run: |
          set +e
          echo "--- /mingw64/qt5-static/ root ---"
          ls /mingw64/qt5-static/
          echo "--- /mingw64/qt5-static/share/ ---"
          ls /mingw64/qt5-static/share/ 2>/dev/null
          echo "--- find libqminimal.a anywhere ---"
          find /mingw64 -name 'libqminimal*' 2>/dev/null | head
          echo "--- find libq*.a under /mingw64/qt5-static/ ---"
          find /mingw64/qt5-static -name 'libq*.a' 2>/dev/null | head -30
          echo "--- find any .a containing 'minimal' or 'windows' under qt5-static ---"
          find /mingw64/qt5-static \( -name '*minimal*' -o -name '*qwindows*' \) 2>/dev/null | head -40
          echo "--- libQt5*.a (lib/) ---"
          ls /mingw64/qt5-static/lib/libQt5*.a 2>/dev/null | head -20
          echo "--- pkgconfig content ---"
          ls /mingw64/qt5-static/lib/pkgconfig/ 2>/dev/null | head -40
          true

      - name: Synthesize .pc stubs for Qt5 private support modules
        # bitcoin_qt.m4 looks up Qt5AccessibilitySupport / ThemeSupport /
        # FontDatabaseSupport / etc via PKG_CHECK_MODULES, but MSYS2's
        # qt5-static package only ships .pc files for the public Qt5
        # modules — not the private internal *Support libraries (whose
        # static .a files are shipped). Generate minimal .pc stubs that
        # point at the static archives so configure can finish detection.
        run: |
          QT_PKGCFG=/mingw64/qt5-static/lib/pkgconfig
          QT_LIBDIR=/mingw64/qt5-static/lib
          QT_INCDIR=/mingw64/qt5-static/include
          QT_VERSION=$(/mingw64/qt5-static/bin/qmake.exe -query QT_VERSION 2>/dev/null | tr -d '\r' || echo 5.15.18)
          echo "Qt version: $QT_VERSION"
          echo "--- existing pkgconfig modules ---"
          ls $QT_PKGCFG | grep -i "Qt5" | head -20
          echo "--- missing modules will be stubbed ---"
          for mod in AccessibilitySupport DeviceDiscoverySupport EdidSupport EventDispatcherSupport FbSupport FontDatabaseSupport ThemeSupport WindowsUIAutomationSupport VulkanSupport; do
            pc="$QT_PKGCFG/Qt5$mod.pc"
            lib="$QT_LIBDIR/libQt5$mod.a"
            if [ -f "$pc" ]; then
              echo "  Qt5$mod: .pc already exists"
            elif [ -f "$lib" ]; then
              cat > "$pc" <<EOF
          prefix=/mingw64/qt5-static
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: Qt5$mod
          Description: Qt5 $mod private support module (MSYS2 stub)
          Version: $QT_VERSION
          Libs: -L\${libdir} -lQt5$mod
          Cflags: -I\${includedir}/Qt5$mod -I\${includedir}
          EOF
              echo "  Qt5$mod: stubbed → $pc"
            else
              echo "  Qt5$mod: NEITHER .pc NOR .a exists, skipping"
            fi
          done

      - name: configure
        run: |
          set -euo pipefail
          BDB_PREFIX="$PWD/bdb48"
          # Fully static build: BDB 4.8, Qt5, libgcc, libstdc++, winpthread
          # all baked into the .exe so it drops on a clean Windows install
          # with no DLLs alongside.
          #
          # Pin both headers and real static archives from the source build;
          # explicit BDB_CFLAGS/BDB_LIBS bypass system autodetection.
          #
          # qt5-static lives at /mingw64/qt5-static/ in MSYS2. Configure's
          # regular pkg-config query omits Libs.private, so provide the full
          # static closure for the public and private Qt modules. Add the
          # transitive font, compression, image, regex, and Vulkan-support
          # archives required by the QWindowsIntegrationPlugin link probe.
          export PKG_CONFIG_PATH=/mingw64/qt5-static/lib/pkgconfig:/mingw64/lib/pkgconfig
          export PATH=/mingw64/qt5-static/bin:$PATH
          QT_STATIC_MODULES=(
            Qt5Core Qt5Gui Qt5Widgets Qt5Network
            Qt5AccessibilitySupport Qt5DeviceDiscoverySupport Qt5EdidSupport
            Qt5EventDispatcherSupport Qt5FbSupport Qt5FontDatabaseSupport
            Qt5ThemeSupport Qt5WindowsUIAutomationSupport Qt5VulkanSupport
          )
          QT_STATIC_LIBS=$(pkg-config --static --libs "${QT_STATIC_MODULES[@]}")
          QT_STATIC_LIBS=$(printf '%s\n' "$QT_STATIC_LIBS" | sed \
            -e 's/-l:libzstd/-lzstd/g' \
            -e 's/-l:libz /-lz /g' \
            -e 's/-l:libz$/-lz/g')
          QT_STATIC_LIBS="$QT_STATIC_LIBS -lQt5VulkanSupport -lfreetype -lharfbuzz -lzstd -lpng16 -lpcre2-16 -lz -lbrotlidec -lbrotlicommon -lbz2"
          export LIBS="-Wl,--start-group $QT_STATIC_LIBS -Wl,--end-group"
          printf 'Static Qt link closure: %s\n' "$LIBS"
          # Keep the GUI build self-contained: the configure LDFLAGS below
          # statically link the MinGW and C++ runtimes as well.
          ./configure \
            --disable-bench \
            --disable-tests \
            --disable-gui-tests \
            --disable-stacktraces \
            --disable-zmq \
            --with-gui=qt5 \
            --with-qt-bindir=/mingw64/qt5-static/bin \
            --with-qt-incdir=/mingw64/qt5-static/include \
            --with-qt-libdir=/mingw64/qt5-static/lib \
            --with-qt-plugindir=/mingw64/qt5-static/share/qt5/plugins \
            --enable-wallet \
            --enable-util-wallet \
            --with-bdb \
            --disable-maintainer-mode \
            --disable-dependency-tracking \
            BDB_CFLAGS="-I$BDB_PREFIX/include" \
            BDB_LIBS="$BDB_PREFIX/lib/libdb_cxx-4.8.a $BDB_PREFIX/lib/libdb-4.8.a" \
            LDFLAGS="-static -static-libgcc -static-libstdc++ -L/mingw64/qt5-static/share/qt5/plugins/platforms -L/mingw64/qt5-static/share/qt5/plugins/styles" \
            || (cat config.log; false)

      - name: make
        run: make -j2

      - name: collect binaries
        run: |
          set -euo pipefail
          mkdir -p artifacts/smartiecoin-windows-msys2
          cp src/smartiecoind.exe       artifacts/smartiecoin-windows-msys2/
          cp src/smartiecoin-cli.exe    artifacts/smartiecoin-windows-msys2/
          cp src/smartiecoin-wallet.exe artifacts/smartiecoin-windows-msys2/
          cp src/smartiecoin-tx.exe artifacts/smartiecoin-windows-msys2/
          cp src/smartiecoin-util.exe artifacts/smartiecoin-windows-msys2/
          cp src/qt/smartiecoin-qt.exe artifacts/smartiecoin-windows-msys2/
          # Strip each packaged executable; fail if the tool cannot process one.
          strip artifacts/smartiecoin-windows-msys2/smartiecoin-wallet.exe
          for name in smartiecoind smartiecoin-cli smartiecoin-tx smartiecoin-util smartiecoin-qt; do
            strip "artifacts/smartiecoin-windows-msys2/$name.exe"
          done
          ls -la artifacts/smartiecoin-windows-msys2/
          file artifacts/smartiecoin-windows-msys2/*.exe

      - name: Verify product versions
        run: |
          set -euo pipefail
          artifact_dir=artifacts/smartiecoin-windows-msys2
          config=src/config/bitcoin-config.h
          major=$(awk '$2 == "CLIENT_VERSION_MAJOR" {print $3}' "$config")
          minor=$(awk '$2 == "CLIENT_VERSION_MINOR" {print $3}' "$config")
          build=$(awk '$2 == "CLIENT_VERSION_BUILD" {print $3}' "$config")
          release_version="$major.$minor.$build"
          expected_version="v$release_version"
          test -n "$major" && test -n "$minor" && test -n "$build"
          for name in smartiecoind smartiecoin-cli smartiecoin-wallet smartiecoin-tx smartiecoin-util; do
            output=$("$artifact_dir/$name.exe" --version)
            [[ "$output" == *"$expected_version"* ]]
          done
          # Qt is a GUI subsystem executable; --version would open a window.
          strings -el "$artifact_dir/smartiecoin-qt.exe" > "$RUNNER_TEMP/qt-version.txt"
          grep -Fq "$release_version" "$RUNNER_TEMP/qt-version.txt"

      - name: Smoke Qt GUI wallet-model startup
        shell: pwsh
        run: ./ci/test/smoke-qt-windows.ps1 -BinaryDir artifacts/smartiecoin-windows-msys2

      - name: Verify release BDB policy
        run: |
          set -euo pipefail
          export LC_ALL=C
          grep -qx '#define ENABLE_WALLET 1' src/config/bitcoin-config.h
          grep -qx '#define USE_BDB 1' src/config/bitcoin-config.h
          artifact_dir=artifacts/smartiecoin-windows-msys2
          check_dir=bdb-release-check
          mkdir -p "$check_dir"
          # Inspect the actual PE imports after stripping, not DLL-like strings.
          for name in smartiecoind smartiecoin-cli smartiecoin-wallet smartiecoin-qt; do
            binary="$artifact_dir/$name.exe"
            test -s "$binary"
            objdump -p "$binary" > "$check_dir/$name.imports"
            grep -q "DLL Name:" "$check_dir/$name.imports"
            if grep -iE 'DLL Name:[[:space:]]*(lib)?(db[_.0-9-]|berkeley)' "$check_dir/$name.imports"; then
              echo "ERROR: dynamic BDB import in $binary" >&2
              exit 1
            else
              status=$?
              test "$status" -eq 1
            fi
          done
          # Inspect linked constants only: .rsrc embeds BDB 6.2 recovery tools,
          # which are not the backend and must not trigger an incompatible build.
          for name in smartiecoind smartiecoin-wallet smartiecoin-qt; do
            objcopy -O binary --only-section=.rdata "$artifact_dir/$name.exe" "$check_dir/$name.rdata"
            test -s "$check_dir/$name.rdata"
            strings "$check_dir/$name.rdata" > "$check_dir/$name.strings"
            versions=$(grep -oE 'Berkeley DB [0-9]+\.[0-9]+\.[0-9]+' "$check_dir/$name.strings" | sort -u)
            test "$versions" = "Berkeley DB 4.8.30"
          done
          # Confirm wallet code survived linking in both node frontends.
          for name in smartiecoind smartiecoin-qt; do
            grep -Fxq -- '-wallet=<path>' "$check_dir/$name.strings"
          done
          # Help does not open a wallet or start a node (avoid headless Qt).
          "$artifact_dir/smartiecoin-wallet.exe" -help > "$check_dir/wallet-help.txt"
          grep -Fq "Get wallet info" "$check_dir/wallet-help.txt"
          # Exercise the packaged wallet tool on a disposable offline wallet.
          # Keep QA data outside artifacts and refuse to reuse existing files.
          test ! -e "$check_dir/wallet"
          mkdir -p "$check_dir/data"
          wallet_path=$(cygpath -m "$PWD/$check_dir/wallet")
          data_path=$(cygpath -m "$PWD/$check_dir/data")
          "$artifact_dir/smartiecoin-wallet.exe" "-datadir=$data_path" "-wallet=$wallet_path" create > "$check_dir/wallet-create.txt"
          grep -qx "Format: bdb" "$check_dir/wallet-create.txt"
          "$artifact_dir/smartiecoin-wallet.exe" "-datadir=$data_path" "-wallet=$wallet_path" info > "$check_dir/wallet-info.txt"
          grep -qx "Format: bdb" "$check_dir/wallet-info.txt"
          python3 -c 'import pathlib, sys; header = pathlib.Path(sys.argv[1]).read_bytes()[:20]; assert len(header) == 20; assert int.from_bytes(header[16:20], "little") == 9' "$check_dir/wallet/wallet.dat"
          python3 contrib/devtools/check-release-bdb.py \
            --config-header src/config/bitcoin-config.h \
            --wallet "$artifact_dir/smartiecoin-wallet.exe" \
            --node "$artifact_dir/smartiecoind.exe" \
            --node "$artifact_dir/smartiecoin-qt.exe" \
            --scan-dir "$artifact_dir" \
            --runtime required \
            --report "$artifact_dir/bdb-gate-windows.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartiecoin-windows-msys2
          path: artifacts/smartiecoin-windows-msys2/
          if-no-files-found: error
          retention-days: 30
